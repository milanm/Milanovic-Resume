name: build

on:
  push:
    branches: [main, "exp/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write edge-case sources (long names, US Letter, font sizes, overflow)
        run: python3 scripts/edge_cases.py --write-only

      - name: Compile LaTeX (LuaLaTeX, tagged PDF)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: |
            resume.tex
            template.tex
            cover-letter.tex
            junior.tex
            edge-letter.tex
            edge-font10.tex
            edge-font12.tex
            edge-long.tex
            edge-columns.tex
            edge-overflow.tex
          latexmk_use_lualatex: true

      - name: Install Typst, poppler and the Python checkers
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils zip
          pip install --quiet pdfminer.six pymupdf pyyaml pillow
          typst --version

      - name: Collect LaTeX PDFs
        run: |
          mkdir -p pdf
          for f in resume template cover-letter junior; do cp "latex/$f.pdf" "pdf/$f-latex.pdf"; done

      - name: Compile Typst
        run: make typst

      - name: Typst Universe template compiles
        run: make universe

      - name: ATS check (one page, clean text layer, reading order)
        run: make check

      - name: Field check (every job's company, title and dates; degrees; skills)
        run: make fields

      - name: Edge cases
        continue-on-error: true
        run: make edge EDGE_FLAGS=--latex-prebuilt

      - name: Accessibility (veraPDF, PDF/UA)
        continue-on-error: true
        run: |
          docker run --rm verapdf/cli:v1.30.3 --help || true
          make verapdf

      - name: veraPDF details (exp)
        if: always()
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/data" -w /data verapdf/cli:v1.30.3 --flavour ua2 --format json pdf/resume-latex.pdf pdf/cover-letter-latex.pdf > build/verapdf-latex.json || true
          docker run --rm -v "$PWD:/data" -w /data verapdf/cli:v1.30.3 --flavour ua1 --format json pdf/resume-typst.pdf > build/verapdf-typst.json || true
          python3 - <<'PY'
          import json
          for f in ("build/verapdf-latex.json", "build/verapdf-typst.json"):
              try:
                  d = json.load(open(f))
              except Exception as e:
                  print(f, "unreadable:", e); print(open(f).read()[:2000]); continue
              def walk(o):
                  if isinstance(o, dict):
                      if "ruleSummaries" in o:
                          for r in o["ruleSummaries"]:
                              print(f, r.get("ruleStatus"), r.get("clause"), r.get("testNumber"), r.get("failedChecks"), (r.get("description") or "")[:160])
                      for v in o.values(): walk(v)
                  elif isinstance(o, list):
                      for v in o: walk(v)
              walk(d)
          PY
          for f in pdf/resume-latex.pdf pdf/resume-typst.pdf; do echo "== $f"; pdfinfo -struct "$f" 2>/dev/null | head -60; done

      - name: "Visual renders (exp, write baselines)"
        run: python3 scripts/visual_diff.py --update

      - name: Overleaf zip and previews
        run: make overleaf previews

      - uses: actions/upload-artifact@v7
        with:
          name: milanovic-resume
          path: |
            pdf/*.pdf
            images/*.png
            build/Milanovic-Resume-overleaf.zip
            build/edge/*.pdf
            build/visual/*.png
            tests/visual/*.png
            build/verapdf-*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdf/*.pdf
            build/Milanovic-Resume-overleaf.zip
