name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile LaTeX (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: |
            resume.tex
            template.tex
            cover-letter.tex
          latexmk_use_xelatex: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Typst, poppler and pdfminer.six
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils zip
          pip install --quiet pdfminer.six
          typst --version

      - name: Collect LaTeX PDFs
        run: |
          mkdir -p pdf
          for f in resume template cover-letter; do cp "latex/$f.pdf" "pdf/$f-latex.pdf"; done

      - name: Compile Typst
        run: make typst

      - name: Typst Universe template compiles
        run: make universe

      - name: ATS check (one page, clean text layer, reading order)
        run: make check

      - name: Overleaf zip and previews
        run: make overleaf previews

      - uses: actions/upload-artifact@v6
        with:
          name: milanovic-resume
          path: |
            pdf/*.pdf
            images/*.png
            build/Milanovic-Resume-overleaf.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdf/*.pdf
            build/Milanovic-Resume-overleaf.zip
